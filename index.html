<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="가상 친환경 기업 그린베일의 홈페이지를 조사해 그린워싱 증거를 모으는 SDGs-ESG 추리 게임">
<meta property="og:title" content="NO GREEN FOUND">
<meta property="og:description" content="초록빛 홈페이지 뒤에 숨은 그린워싱을 찾아라 · SDGs-ESG 공모전 〈동아리, 가치 더하기〉">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NO GREEN FOUND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 가상 데스크톱 OS. 창(브라우저·증거함·메일·신고서)을 띄워 가짜 친환경 기업 사이트를 조사하는 단일 화면 앱. 의도적으로 단일 테마. */
:root{
  --desk:#24423f; --desk-2:#172b29; --desk-line:#2f5450;
  --chrome:#e9e5dc; --chrome-2:#d4cec2; --chrome-edge:#8d877b; --ink:#1e2422; --muted:#5d6560;
  --site-bg:#f2f7ef; --site-ink:#173326; --leaf:#2e8a4e; --leaf-2:#cfe6cf; --sky:#d7ece6;
  --stamp:#bf3a2b; --paper:#fbf8f0; --hl:#f3d34a; --ok:#2e7d4f;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Gowun Batang","Nanum Myeongjo",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk-2);color:var(--ink);font-family:var(--f-ui);overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

#os{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#desk{position:relative;overflow:hidden;
  background:
    radial-gradient(120% 90% at 85% 10%, #2f5753 0%, transparent 55%),
    repeating-linear-gradient(0deg, transparent 0 31px, var(--desk-line) 31px 32px),
    repeating-linear-gradient(90deg, transparent 0 31px, var(--desk-line) 31px 32px),
    var(--desk);}
#icons{position:absolute;left:16px;top:16px;display:grid;gap:10px;grid-template-columns:84px}
.dicon{background:none;border:0;color:#eef3ee;display:grid;justify-items:center;gap:6px;padding:8px 4px;border-radius:6px;font-size:12px;text-shadow:0 1px 2px #0008}
.dicon:hover{background:#ffffff14}
.dicon svg{width:40px;height:40px}
.dicon .badge{font-family:var(--f-mono);font-size:10px;background:var(--stamp);color:#fff;border-radius:8px;padding:0 6px;margin-top:-4px}

/* windows */
.win{position:absolute;background:var(--chrome);border:1px solid var(--chrome-edge);border-radius:8px;box-shadow:0 18px 40px #0007,0 2px 0 #fff6 inset;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.win.hidden{display:none}
.tbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--chrome-2);border-bottom:1px solid var(--chrome-edge);user-select:none;cursor:grab;touch-action:none}
.tbar h2{margin:0;font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .x{width:22px;height:22px;border-radius:50%;border:1px solid var(--chrome-edge);background:var(--chrome);display:grid;place-items:center;font-size:12px;line-height:1}
.tbar .x:hover{background:var(--stamp);color:#fff}
.wbody{flex:1;overflow:auto;min-height:0}

/* taskbar */
#bar{display:flex;align-items:center;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#101c1b;color:#dfe8e2;border-top:1px solid #2c4542}
#bar .start{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.06em;background:var(--hl);color:#1a1a12;border:0;border-radius:4px;padding:5px 10px}
#tasks{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
#tasks button{background:#1d2e2c;border:1px solid #2f4a47;color:#dfe8e2;border-radius:4px;padding:4px 10px;font-size:12px;white-space:nowrap}
#tasks button.on{background:#335450;border-color:#4f7a75}
#meter{font-family:var(--f-mono);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#meter i{display:inline-block;width:8px;height:12px;background:#2f4a47;border-radius:1px}
#meter i.on{background:var(--hl)}
#clock{font-family:var(--f-mono);font-size:12px;opacity:.8;white-space:nowrap}

/* browser */
.bwrap{display:flex;flex-direction:column;height:100%}
.btool{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--chrome-2);flex-wrap:wrap}
.btool .nb{border:1px solid var(--chrome-edge);background:#f5f2ec;border-radius:4px;padding:3px 9px}
.btool form{flex:1;display:flex;min-width:180px}
.btool input{flex:1;min-width:0;border:1px solid var(--chrome-edge);border-radius:4px 0 0 4px;padding:4px 8px;background:#fff;font-family:var(--f-mono);font-size:12px}
.btool form button{border:1px solid var(--chrome-edge);border-left:0;border-radius:0 4px 4px 0;background:#f5f2ec;padding:3px 10px}
.inspect{display:flex;align-items:center;gap:6px;border:1px solid var(--chrome-edge);background:#f5f2ec;border-radius:4px;padding:3px 10px;font-weight:600}
.inspect[aria-pressed="true"]{background:var(--hl);border-color:#9a8420}
.bmarks{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--chrome-edge);font-size:12px;flex-wrap:wrap}
.bmarks button{border:0;background:none;padding:2px 8px;border-radius:4px;color:var(--muted)}
.bmarks button:hover{background:var(--chrome-2);color:var(--ink)}
.view{flex:1;overflow:auto;background:#fff;position:relative}
.view.inspecting, .view.inspecting *{cursor:zoom-in!important}

/* ===== company site ===== */
.site{background:var(--site-bg);color:var(--site-ink);min-height:100%;font-size:15px;transition:filter .8s}
.s-head{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--leaf-2);flex-wrap:wrap;background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--leaf);text-decoration:none}
.logo svg{width:26px;height:26px;transition:filter .8s}
.s-nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.s-nav a{color:var(--site-ink);text-decoration:none;padding:6px 10px;border-radius:20px;font-size:13px}
.s-nav a.cur{background:var(--leaf-2)}
.s-main{padding:28px 24px 40px;display:grid;gap:28px;max-width:860px}
.hero{display:grid;gap:12px;padding:28px;border-radius:18px;background:linear-gradient(135deg,#e3f2df,#cfe9dd 60%,#bfe0d6);position:relative;overflow:hidden}
.hero h1{font-family:var(--f-disp);font-size:clamp(26px,4vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.hero p{margin:0;max-width:56ch;line-height:1.7}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border-radius:12px;padding:16px;display:grid;gap:4px}
.stat b{font-family:var(--f-disp);font-size:28px;color:var(--leaf);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#4c6457}
.s-sec{display:grid;gap:12px}
.s-sec h2{font-family:var(--f-disp);font-size:24px;margin:0}
.s-sec p{margin:0;line-height:1.75;max-width:62ch}
.river{border-radius:14px;overflow:hidden;background:#fff;display:grid}
.river .pic{height:150px;background:
  linear-gradient(170deg,transparent 0 46%,#8ccbd6 46% 58%,transparent 58%),
  linear-gradient(180deg,#bfe3f0 0 40%,#9fd09a 40% 100%);position:relative}
.river .pic::after{content:"";position:absolute;right:10%;top:22%;width:70px;height:46px;background:#c9cfc8;border-radius:3px;box-shadow:-18px 10px 0 -6px #b8beb6}
.river figcaption{padding:12px 16px;font-size:13px;color:#4c6457}
.prod{display:grid;grid-template-columns:140px 1fr;gap:18px;background:#fff;border-radius:14px;padding:18px;align-items:center}
.prod .box{aspect-ratio:1;max-width:100%;border-radius:10px;background:repeating-linear-gradient(45deg,#d9c9a3 0 8px,#cfbe95 8px 16px);display:grid;place-items:center;font-family:var(--f-disp);color:#5a4a2a;font-weight:700}
.gbadge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--leaf);color:var(--leaf);border-radius:30px;padding:4px 12px 4px 6px;font-weight:700;font-size:12px;background:#f3fbf2}
.gbadge svg{width:20px;height:20px}
.chart{background:#fff;border-radius:14px;padding:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart .grid{stroke:#e2ebe2;stroke-width:1}
.chart .tl{font:11px var(--f-mono);fill:#6a7d70}
.chart .yl{font:12px var(--f-ui);fill:#2b4a3a}
.chart .b12{fill:var(--leaf)}
.chart .b3{fill:#d98a6a}
.chart .cap{font:600 12px var(--f-ui);fill:var(--stamp)}
table.t{border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:8px 12px;border-bottom:1px solid #e3ece3;text-align:left}
.forest{border-radius:14px;padding:22px;background:linear-gradient(160deg,#16452c,#2a6b3f);color:#e9f6ec;display:grid;gap:10px}
.forest h2{color:#fff}
.forest code{font-family:var(--f-mono);background:#0003;padding:2px 6px;border-radius:4px}
.job{display:flex;justify-content:space-between;gap:12px;background:#fff;border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.ghost{color:var(--site-bg);line-height:1.7;font-size:13px;user-select:text}
.ghost::selection{background:var(--stamp);color:#fff}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.person{background:#fff;border-radius:12px;padding:16px;display:grid;gap:2px}
.person .av{width:46px;height:46px;border-radius:50%;background:var(--leaf-2);margin-bottom:8px}
.person b{font-size:16px}
.person small{color:#5b7365}
.s-foot{padding:18px 24px;font-size:12px;color:#6b8073;border-top:1px solid var(--leaf-2)}
.ticker{font-size:12px;color:#4c6457;background:#fff;border-radius:30px;padding:6px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.view{container-type:inline-size}
.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:24px}
.hero-txt{display:grid;gap:14px;min-width:0}
.hero-img{margin:0;display:grid;gap:6px;min-width:0}
.hero-img svg,.river svg,.sat svg{display:block;width:100%;height:auto}
.hero-img svg{border-radius:12px;box-shadow:0 12px 26px #1b3d2a40}
.hero-img figcaption{font-size:12px;color:#456352}
.hero-img small{display:block;color:#7a8f81;font-size:10.5px}
.ctas{display:flex;gap:8px;flex-wrap:wrap}
.cta{background:var(--leaf);color:#fff;text-decoration:none;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600}
.cta2{background:#fff;color:var(--leaf);border:1px solid var(--leaf)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.donut-card{background:#fff;border-radius:14px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.fine{font-size:11.5px!important;color:#7a8f81}
.road{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.road li{background:#fff;border-radius:12px;padding:14px;border-top:3px solid var(--leaf);display:grid;gap:4px}
.road b{font-family:var(--f-mono);color:var(--leaf);font-size:13px}
.road small{color:#7a8f81;font-size:11px}
.sat{margin:0;border-radius:14px;overflow:hidden;background:#fff;display:grid}
.sat figcaption,.river figcaption{padding:10px 16px;font-size:13px;color:#4c6457}
.prod .box{background:#f5efe2;padding:8px}
.prod .box svg{width:100%;height:auto}
.person .av{overflow:hidden}
.blades{animation:spin var(--d,7s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@container (max-width:640px){.hero,.two{grid-template-columns:1fr}.road{grid-template-columns:repeat(2,minmax(0,1fr))}.prod{grid-template-columns:1fr}.prod .box{max-width:140px}}
/* exposed truths & corruption */
.sus.exposed{text-decoration:line-through 2px var(--stamp);opacity:.75}
.truth{display:block;margin-top:6px;font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--stamp);background:#fff3ef;border-left:3px solid var(--stamp);padding:6px 10px;text-decoration:none;transform:rotate(-.3deg)}
.truth::before{content:"[검증] ";font-weight:600}
.ghost.exposed{color:var(--stamp)}
.site.c2 .logo svg{filter:hue-rotate(-60deg) saturate(.6)}
.site.c3 .hero{background:linear-gradient(135deg,#e6ebe2,#d6ded6 60%,#c9d1cc)}
.site.c4 .hero h1{animation:glitch 4s infinite steps(1)}
.site.c5{filter:saturate(.55)}
.site.c6 .logo{color:#7d6a52}
.site.c7{filter:saturate(.2) contrast(1.05)}
.site.c7 .s-head{border-bottom-color:var(--stamp)}
@keyframes glitch{0%,92%{transform:none;text-shadow:none}93%{transform:translateX(3px);text-shadow:-2px 0 var(--stamp)}95%{transform:translateX(-2px);text-shadow:2px 0 #2b7}97%{transform:none}}
.flash{animation:flash .7s}
@keyframes flash{0%{filter:invert(1)}30%{filter:invert(0) hue-rotate(90deg)}100%{filter:none}}
.apology{background:var(--paper);border:2px solid var(--stamp);border-radius:12px;padding:20px;display:grid;gap:8px}
.apology h2{color:var(--stamp)}

/* ===== search engine ===== */
.seekr{min-height:100%;background:#fafaf8;color:#222;font-family:var(--f-ui)}
.sk-home{display:grid;justify-items:center;gap:16px;padding:60px 16px}
.sk-logo{font-family:var(--f-mono);font-weight:600;font-size:34px;letter-spacing:-.02em}
.sk-logo span{color:#3a6ea5}
.sk-form{display:flex;width:min(560px,100%)}
.sk-form input{flex:1;min-width:0;padding:10px 16px;border:1px solid #bbb;border-radius:24px 0 0 24px;background:#fff}
.sk-form button{padding:10px 18px;border:1px solid #bbb;border-left:0;border-radius:0 24px 24px 0;background:#eee}
.sk-top{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #e3e3e0;flex-wrap:wrap}
.sk-top .sk-logo{font-size:20px}
.sk-res{padding:16px 20px 40px;display:grid;gap:22px;max-width:680px}
.sk-r{display:grid;gap:4px}
.sk-r .url{font-family:var(--f-mono);font-size:12px;color:#3b7a4b}
.sk-r h3{margin:0;font-size:17px;color:#2a55a0;font-weight:500}
.sk-r p{margin:0;line-height:1.65;color:#444;font-size:14px}
.sk-r .date{color:#888;font-size:12px}
.sk-meta{font-size:12px;color:#888}
.nores{display:grid;justify-items:center;gap:10px;padding:70px 16px;text-align:center}
.nores b{font-family:var(--f-mono);font-size:clamp(22px,5vw,40px);letter-spacing:.08em;color:#2a2a2a}
.nores p{margin:0;color:#777;max-width:44ch;line-height:1.6}
.sk-sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sk-sugg button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:4px 12px;font-size:12px}
.errpage{padding:60px 24px;font-family:var(--f-mono);display:grid;gap:10px}
.errpage b{font-size:36px}

/* ===== evidence / mail / report ===== */
.pad{padding:16px;display:grid;gap:14px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ev{background:var(--paper);border:1px solid #d8d0bd;border-radius:6px;padding:12px;display:grid;gap:6px;align-content:start;position:relative;min-width:0}
.ev.empty{background:repeating-linear-gradient(-45deg,#e3ded3 0 6px,#ddd7cb 6px 12px);color:#8a8477;place-items:center;min-height:120px;font-family:var(--f-mono)}
.ev h3{margin:0;font-size:14px}
.ev .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ev .claim{font-size:12px;color:var(--muted);text-decoration:line-through}
.ev .tru{font-size:13px;line-height:1.55}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:10.5px;border-radius:3px;padding:1px 6px;background:#24423f;color:#e9f3ee}
.chip.e{background:#2e7d4f}.chip.s{background:#a8632a}.chip.g{background:#4a4f8a}
.stampmark{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--stamp);border:1.5px solid var(--stamp);padding:0 5px;transform:rotate(6deg)}
.mail{display:grid;grid-template-columns:200px 1fr;height:100%}
.mlist{border-right:1px solid var(--chrome-2);overflow:auto;background:#f3f0e9}
.mlist button{display:grid;gap:2px;text-align:left;width:100%;border:0;border-bottom:1px solid var(--chrome-2);background:none;padding:10px 12px}
.mlist button.cur{background:#fff}
.mlist button.unread b::before{content:"● ";color:var(--stamp)}
.mlist small{color:var(--muted);font-size:11px}
.mread{padding:18px;overflow:auto;background:#fff;line-height:1.75;min-width:0}
.mread h3{margin:0 0 4px;font-size:16px}
.mread .from{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:var(--f-mono)}
.mread p{margin:0 0 12px;max-width:62ch}
.btn{border:1px solid var(--chrome-edge);background:#f5f2ec;border-radius:5px;padding:7px 14px;font-weight:600}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--stamp);color:#fff;border-color:var(--stamp)}
.hintbox{background:#fff8d6;border:1px dashed #b39a2a;border-radius:6px;padding:10px 12px;font-size:13px}
.form-row{display:grid;gap:6px}
.form-row label{font-weight:600;font-size:13px}
.opt{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--chrome-2);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:3px}
.opt small{display:block;color:var(--muted)}
textarea{border:1px solid var(--chrome-edge);border-radius:5px;padding:8px;min-height:70px;resize:vertical;background:#fff}

/* modal */
#modal{position:absolute;inset:0;background:#0b1514b3;display:grid;place-items:center;padding:16px;z-index:9000}
#modal[hidden]{display:none!important}
.mbox{background:var(--paper);border-radius:10px;max-width:560px;width:100%;max-height:100%;overflow:auto;box-shadow:0 30px 60px #000a;border:1px solid #cfc6b1}
.mbox .mh{padding:14px 18px;border-bottom:1px solid #e3dccb;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.mbox .mb{padding:18px;display:grid;gap:12px}
.mbox h3{margin:0;font-size:18px;line-height:1.4}
.quote{font-family:var(--f-disp);font-size:16px;background:#fff;border-left:4px solid var(--leaf);padding:10px 14px}
.qopt{display:block;width:100%;text-align:left;border:1px solid #d6cdb8;background:#fff;border-radius:6px;padding:10px 12px;line-height:1.5}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.big-stamp{font-family:var(--f-mono);font-weight:600;color:var(--stamp);border:3px solid var(--stamp);display:inline-block;padding:4px 12px;transform:rotate(-4deg);letter-spacing:.1em;justify-self:start}

#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#101c1bee;color:#f0f4f1;padding:10px 16px;border-radius:6px;font-size:13px;max-width:min(520px,calc(100% - 32px));z-index:9500;line-height:1.5;border-left:3px solid var(--hl)}
#toast[hidden]{display:none!important}

/* boot */
#boot{position:fixed;inset:0;z-index:10000;background:var(--desk-2);color:#e7efe9;display:grid;place-items:center;padding:16px;overflow:auto}
#boot[hidden]{display:none!important}
.bootbox{max-width:620px;display:grid;gap:18px}
.bootbox .t{font-family:var(--f-mono);font-weight:600;font-size:clamp(34px,8vw,64px);letter-spacing:.04em;line-height:1}
.bootbox .t s{color:var(--hl);text-decoration-color:var(--stamp);text-decoration-thickness:4px}
.bootbox p{margin:0;line-height:1.75;color:#b9c9c0;max-width:56ch}
.bootbox .row{display:flex;gap:10px;flex-wrap:wrap}
.bootbox .btn{background:#1f3532;color:#e7efe9;border-color:#3d5e5a}
.bootbox .btn.pri{background:var(--hl);color:#1a1a12;border-color:var(--hl)}
.bootbox small{font-family:var(--f-mono);color:#7f978c;font-size:11px}

@media (max-width:760px){
  #icons{display:none}
  .win{left:8px!important;top:8px!important;right:8px;bottom:8px;width:auto!important;height:auto!important}
  .tbar{cursor:default}
  .mail{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .mlist{border-right:0;border-bottom:1px solid var(--chrome-2);max-height:150px}
  .prod{grid-template-columns:1fr}
  .prod .box{max-width:140px}
  .s-main{padding:20px 16px 32px}
  .s-head{padding:12px 16px}
  #meter .lbl,#clock{display:none}
  #meter #meterBars{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="boot">
  <div class="bootbox">
    <small>SDGs-ESG 공모전 〈동아리, 가치 더하기〉 출품작 · 데스크톱 추리 어드벤처</small>
    <div class="t">NO <s>GREEN</s><br>FOUND</div>
    <p>친환경 기업 <b>그린베일(GreenVeil)</b>의 홈페이지는 완벽해 보입니다. 익명의 제보자가 그 초록빛 뒤에 숨은 이야기를 보내왔습니다. 브라우저와 검색엔진으로 사이트를 뒤지고, 수상한 문구를 찾아 증거를 모으고, 신고서를 제출하세요.</p>
    <p>약 15–20분 · 증거 7개 · 엔딩 4종. 그린베일과 등장인물, 사건은 모두 가상입니다.</p>
    <div class="row">
      <button class="btn pri" id="bootStart">조사 시작</button>
      <button class="btn" id="bootResume" hidden>이어서 하기</button>
    </div>
  </div>
</div>

<div id="os">
  <div id="desk">
    <div id="icons"></div>
    <div id="toast" hidden></div>
    <div id="modal" hidden><div class="mbox" id="mbox"></div></div>
  </div>
  <div id="bar">
    <button class="start" id="startBtn" title="처음부터 다시">NGF</button>
    <div id="tasks"></div>
    <div id="meter"><span class="lbl">증거</span><span id="meterBars"></span><span id="meterNum">0/7</span></div>
    <div id="clock"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- data ---------------- */
const SDG={6:"깨끗한 물과 위생",7:"깨끗한 에너지",8:"양질의 일자리",12:"책임 있는 소비·생산",13:"기후변화 대응",14:"해양생태계",15:"육상생태계",16:"정의·강력한 제도"};
const ORDER=["rec","badge","chart","river","forest","labor","board"];
const CLUES={
 rec:{title:"'100% 재생에너지' 운영",where:"홈 > 메인 배너",esg:"E",sdg:[7,13],
  claim:"모든 사업장을 100% 재생에너지로 운영합니다",
  truth:"재생에너지 인증서(REC)를 구매해 서류상으로만 상쇄. 실제 공장 전력의 92%는 화력발전 기반 계약(2025 전력거래 내역).",
  q:"이 문구는 어떤 방식으로 소비자를 오해하게 만들까요?",
  opts:["사실이지만 제품과 상관없는 정보를 강조했다","인증서 구매를 실제 재생에너지 사용처럼 표현했다","외부 검증이 없는 자체 인증마크를 붙였다","더 나쁜 경쟁사와 비교해 상대적으로 좋아 보이게 했다"],a:1,
  explain:"REC는 재생에너지 발전의 '환경 가치'를 사는 증서입니다. 산 만큼 상쇄했다고 말할 수는 있지만, 공장이 실제로 재생에너지 전기를 쓴다는 뜻은 아닙니다.",
  hint:"메인 배너 문장 중 숫자가 들어간 주장을 조사 모드로 눌러보세요. 검색엔진에 'REC'를 찾아봐도 좋습니다."},
 badge:{title:"자체 제작 'GV-Green 인증'",where:"제품 > 에코팩",esg:"E",sdg:[12],
  claim:"GV-Green 인증 · 100% 생분해 포장재",
  truth:"인증 발급기관은 그린베일 ESG센터(자사). 외부 검증 없음. '생분해'는 58℃ 산업용 퇴비화 시설에서만 가능하고 국내 수거 체계도 없음.",
  q:"이 인증 마크의 핵심 문제는 무엇일까요?",
  opts:["인증 기준이 너무 엄격하다","외부 기관 인증처럼 보이게 만든 자체 라벨이다","생분해 기간을 너무 짧게 적었다","친환경 제품을 너무 비싸게 판다"],a:1,
  explain:"제3자 검증 없이 기업이 직접 만든 인증마크는 공인 인증처럼 보이게 해 소비자를 오인시키는 대표적 그린워싱 유형(가짜 라벨)입니다.",
  hint:"제품 페이지의 초록색 인증 마크를 조사해보세요. 검색엔진에 마크 이름을 넣어봐도 됩니다."},
 chart:{title:"착시를 노린 배출량 그래프",where:"지속가능경영 > 배출 추이",esg:"E",sdg:[13],
  claim:"5년간 탄소 배출 대폭 감축",
  truth:"y축이 0이 아니라 9,600에서 시작해 6.4% 감소가 절반 이상 줄어든 것처럼 보임. 가장 큰 배출원인 Scope 3(공급망)는 18% 증가했고, 포함하면 총배출은 9.9% 늘었음.",
  q:"이 그래프가 감축 효과를 부풀린 방법은?",
  opts:["단위를 톤이 아닌 킬로그램으로 바꿨다","y축을 0이 아닌 값에서 시작하고, 가장 큰 배출원을 뺐다","연도 순서를 거꾸로 배치했다","다른 회사의 데이터를 가져왔다"],a:1,
  explain:"축 잘라내기는 작은 변화를 크게 보이게 하는 고전적 시각 왜곡입니다. 여기에 Scope 3를 '산정 중'으로 빼면 실제 총배출 증가가 가려집니다.",
  hint:"그래프의 y축 숫자를 잘 보세요. 맨 아래 눈금이 몇에서 시작하나요?"},
 river:{title:"반석천 폐수 방류",where:"검색 > 지역 뉴스",esg:"E",sdg:[6,14],
  claim:"반석천 생태 복원 1주년, 맑은 물과 함께 흐르는 2공장",
  truth:"2공장 방류구 인근 시료의 COD가 배출허용기준의 3.4배. 하류에서 물고기 집단 폐사 2건. 홈페이지 사진은 상류 지점에서 촬영.",
  q:"홈페이지의 '반석천 복원' 홍보와 비교하면 어떤 유형의 그린워싱일까요?",
  opts:["좋은 면만 보여주고 더 큰 환경 피해는 숨겼다","인증서를 잘못 표기했다","그래프의 축을 조작했다","친환경과 무관한 상을 받았다고 했다"],a:0,
  explain:"일부 긍정적 활동을 앞세워 핵심 환경영향을 가리는 것을 '숨겨진 상충효과(hidden trade-off)'라고 부릅니다.",
  hint:"홈 화면 사진 설명에 나온 하천 이름을 검색엔진에 검색해보세요."},
 forest:{title:"추가성 없는 '숲 프로젝트'",where:"검색 > 위성사진 분석 기사",esg:"E",sdg:[13,15],
  claim:"아마조니아 리프 REDD+ 프로젝트로 연 12,000 tCO₂e 상쇄",
  truth:"프로젝트 부지는 2011년부터 국립보호구역. 그린베일이 없어도 벌채될 수 없던 숲이라 상쇄 효과가 없음. 등록번호 VCS-2417은 등록부에 존재하지 않음.",
  q:"이 탄소상쇄 크레딧은 어떤 원칙을 위반했나요?",
  opts:["영속성: 숲이 나중에 불에 탈 수 있다","누출: 벌채가 다른 지역으로 옮겨갔다","추가성: 사업이 없어도 어차피 보호될 숲이다","이중계산: 두 회사가 같은 크레딧을 썼다"],a:2,
  explain:"탄소상쇄가 인정되려면 그 사업이 없었다면 일어나지 않았을 감축이어야 합니다(추가성). 이미 보호구역인 숲을 지킨다는 크레딧은 실제 감축이 0입니다.",
  hint:"숲 프로젝트 페이지의 등록번호와 프로젝트 이름을 각각 검색해보세요."},
 labor:{title:"숨겨진 협력사 노동 실태",where:"채용 > 공정한 일터",esg:"S",sdg:[8],
  claim:"협력사까지 함께하는 공정한 일터",
  truth:"베트남 협력사 3곳 감사 결과를 비공개 처리. 평균 주 68시간 근무, 최저임금 미달 사례 확인(내부 메모).",
  q:"이 문제는 ESG 중 어느 영역이며, 어떤 SDG와 가장 직접 연결될까요?",
  opts:["E(환경) · SDG 13 기후변화 대응","S(사회) · SDG 8 양질의 일자리와 경제성장","G(지배구조) · SDG 16 정의와 제도","E(환경) · SDG 12 책임 있는 소비·생산"],a:1,
  explain:"공급망 노동권은 ESG의 S(사회) 영역입니다. 친환경 이미지가 있어도 협력사 노동 착취를 숨기면 지속가능경영이 아닙니다.",
  hint:"채용 페이지에서 문단 사이 빈 공간이 넓은 곳을 마우스로 드래그해보세요."},
 board:{title:"독립성 없는 ESG위원회",where:"검색 > 경제지 기사",esg:"G",sdg:[16],
  claim:"ESG위원회 위원장 한도윤 (사외이사)",
  truth:"한도윤 위원장은 한도진 대표의 친동생이자 계열사 대표. 사외이사 표기는 사실과 다름. 대표를 감시할 위원회를 대표 가족이 이끄는 구조.",
  q:"이 지배구조의 문제는 무엇일까요?",
  opts:["위원회 회의가 너무 자주 열린다","위원장이 환경 전공자가 아니다","감시 기구가 경영진과 이해관계로 묶여 독립성이 없다","위원회 인원이 홀수다"],a:2,
  explain:"ESG위원회와 사외이사는 경영진을 견제하는 장치입니다. 대표의 가족이 '사외이사'로 위원장을 맡으면 견제 기능이 사라집니다(G·지배구조).",
  hint:"회사소개 페이지에서 대표와 위원장의 이름을 비교해보고, 검색엔진에 위원장 이름을 넣어보세요."}
};
const PLAIN=["평범해 보인다. 다른 곳을 살펴보자.","특별히 수상한 점은 없다.","광고 문구일 뿐, 확인할 근거가 없다.","여기는 문제가 없어 보인다."];

/* ---------------- state ---------------- */
const KEY="ngf-save-v1";
let S={found:[],wrong:0,read:["m1"],ended:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&Array.isArray(v.found))return v}catch(e){}return null}
const has=id=>S.found.includes(id);

/* ---------------- toast & modal ---------------- */
let tt;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600)}
function modal(html){$("#mbox").innerHTML=html;$("#modal").hidden=false;const f=$("#mbox").querySelector("button");if(f)f.focus()}
function closeModal(){$("#modal").hidden=true}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

/* ---------------- windows ---------------- */
const WINS={
 browser:{title:"브라우저",icon:"web",x:120,y:24,w:780,h:560},
 evidence:{title:"증거함",icon:"folder",x:260,y:70,w:620,h:480},
 mail:{title:"메일 · 익명 제보함",icon:"mail",x:180,y:50,w:640,h:440},
 report:{title:"신고서 작성",icon:"form",x:300,y:40,w:560,h:540}
};
const ICONSVG={
 web:'<svg viewBox="0 0 40 40"><rect x="3" y="6" width="34" height="28" rx="3" fill="#e9e5dc" stroke="#1e2422"/><rect x="3" y="6" width="34" height="7" rx="3" fill="#cfc8bb"/><circle cx="20" cy="23" r="7" fill="none" stroke="#2e8a4e" stroke-width="2"/><path d="M13 23h14M20 16c-3 4-3 10 0 14M20 16c3 4 3 10 0 14" stroke="#2e8a4e" fill="none"/></svg>',
 folder:'<svg viewBox="0 0 40 40"><path d="M4 11h12l3 3h17v19H4z" fill="#f3d34a" stroke="#1e2422"/><rect x="10" y="17" width="20" height="12" fill="#fbf8f0" stroke="#1e2422" transform="rotate(-4 20 23)"/></svg>',
 mail:'<svg viewBox="0 0 40 40"><rect x="4" y="9" width="32" height="22" rx="2" fill="#fbf8f0" stroke="#1e2422"/><path d="M4 10l16 12 16-12" fill="none" stroke="#1e2422"/></svg>',
 form:'<svg viewBox="0 0 40 40"><rect x="8" y="4" width="24" height="32" rx="2" fill="#fbf8f0" stroke="#1e2422"/><path d="M13 12h14M13 17h14M13 22h9" stroke="#5d6560"/><circle cx="26" cy="28" r="5" fill="none" stroke="#bf3a2b" stroke-width="2"/></svg>'
};
let z=10;
function buildIcons(){
 $("#icons").innerHTML=Object.entries(WINS).map(([k,w])=>`<button class="dicon" data-open="${k}">${ICONSVG[w.icon]}<span>${w.title.split(" ·")[0]}</span>${k==="mail"?'<span class="badge" id="mailBadge" hidden>1</span>':""}${k==="evidence"?'<span class="badge" id="evBadge">0</span>':""}</button>`).join("");
 $("#icons").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openWin(b.dataset.open)});
}
function makeWin(k){
 const w=WINS[k];const el=document.createElement("section");
 el.className="win hidden";el.id="w-"+k;el.setAttribute("aria-label",w.title);
 el.style.cssText=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px`;
 el.innerHTML=`<div class="tbar"><h2>${w.title}</h2><button class="x" aria-label="닫기">✕</button></div><div class="wbody" id="b-${k}"></div>`;
 $("#desk").appendChild(el);
 el.addEventListener("pointerdown",()=>focusWin(k));
 el.querySelector(".x").addEventListener("click",e=>{e.stopPropagation();el.classList.add("hidden");renderTasks()});
 const bar=el.querySelector(".tbar");
 bar.addEventListener("pointerdown",e=>{
  if(e.target.closest(".x")||window.innerWidth<=760)return;
  const r=el.getBoundingClientRect(),d=$("#desk").getBoundingClientRect();
  const ox=e.clientX-r.left,oy=e.clientY-r.top;bar.setPointerCapture(e.pointerId);
  const mv=ev=>{let x=ev.clientX-d.left-ox,y=ev.clientY-d.top-oy;
   x=Math.max(-r.width+80,Math.min(d.width-80,x));y=Math.max(0,Math.min(d.height-40,y));
   el.style.left=x+"px";el.style.top=y+"px"};
  const up=()=>{bar.removeEventListener("pointermove",mv);bar.removeEventListener("pointerup",up)};
  bar.addEventListener("pointermove",mv);bar.addEventListener("pointerup",up);
 });
}
function fitWin(el){
 const d=$("#desk").getBoundingClientRect();
 if(window.innerWidth<=760)return;
 const w=Math.min(parseFloat(el.style.width),d.width-32),h=Math.min(parseFloat(el.style.height),d.height-32);
 el.style.width=w+"px";el.style.height=h+"px";
 if(parseFloat(el.style.left)+w>d.width)el.style.left=Math.max(16,d.width-w-16)+"px";
 if(parseFloat(el.style.top)+h>d.height)el.style.top=Math.max(8,d.height-h-8)+"px";
}
function openWin(k){const el=$("#w-"+k);el.classList.remove("hidden");fitWin(el);focusWin(k);
 if(k==="evidence")renderEvidence();if(k==="mail")renderMail();if(k==="report")renderReport();}
function focusWin(k){$("#w-"+k).style.zIndex=++z;renderTasks(k)}
function renderTasks(active){
 const open=Object.keys(WINS).filter(k=>!$("#w-"+k).classList.contains("hidden"));
 if(!active){let m=-1;open.forEach(k=>{const zz=+$("#w-"+k).style.zIndex||0;if(zz>m){m=zz;active=k}})}

function chartSVG(honest){
 const yrs=[2021,2022,2023,2024,2025],a=[10420,10180,9980,9860,9750],b=[21000,21900,22800,23700,24780];
 const W=560,H=250,L=70,R=18,T=26,B=40,pw=W-L-R,ph=H-T-B;
 const lo=honest?0:9600,hi=honest?36000:10500,ticks=honest?[0,9000,18000,27000,36000]:[9600,9800,10000,10200,10400];
 const y=v=>T+ph-(v-lo)/(hi-lo)*ph,bw=pw/5*.55;
 let g=`<text class="yl" x="${L}" y="16">${honest?"총배출 (Scope 1+2+3, tCO₂e)":"탄소 배출량 (tCO₂e)"}</text>`;
 let lab="";
 ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/>`;lab+=`<text class="tl" x="${L-8}" y="${y(t)+4}" text-anchor="end">${t.toLocaleString()}</text>`});
 g+=honest?`<g>${lab}</g>`:`<g class="sus" data-clue="chart"><rect x="0" y="${T-6}" width="${L-2}" height="${ph+12}" fill="transparent"/>${lab}</g>`;
 yrs.forEach((yr,i)=>{const cx=L+pw/5*(i+.5),x=cx-bw/2;
  g+=`<rect class="b12" x="${x}" y="${y(a[i])}" width="${bw}" height="${y(lo)-y(a[i])}" rx="2"/>`;
  if(honest)g+=`<rect class="b3" x="${x}" y="${y(a[i]+b[i])}" width="${bw}" height="${y(a[i])-y(a[i]+b[i])}" rx="2"/>`;
  g+=`<text class="tl" x="${cx}" y="${H-16}" text-anchor="middle">${yr}</text>`;
 });
 if(honest)g+=`<rect class="b12" x="${W-196}" y="8" width="10" height="10"/><text class="tl" x="${W-182}" y="17">Scope 1+2</text><rect class="b3" x="${W-112}" y="8" width="10" height="10"/><text class="tl" x="${W-98}" y="17">Scope 3</text><text class="cap" x="${L}" y="${H-2}">2021 → 2025 총배출 +9.9%</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 탄소 배출 그래프">${g}</svg>`;
}

function seekr(r){
 const q=decodeURIComponent((r.split("?q=")[1]||"")).trim();
 const form=`<form class="sk-form"><input value="${esc(q)}" placeholder="검색어를 입력하세요" aria-label="검색어"><button>검색</button></form>`;
 if(!q)return `<div class="seekr"><div class="sk-home"><div class="sk-logo">seek<span>r</span></div>${form}<div class="sk-sugg"><button data-q="그린워싱">그린워싱</button><button data-q="ESG">ESG</button><button data-q="SDGs">SDGs</button></div></div></div>`;
 const nq=q.toLowerCase().replace(/\s+/g,"");
 const hit=SEARCH.find(s=>s.k.some(k=>nq.includes(k.toLowerCase().replace(/\s+/g,""))));
 const top=`<div class="sk-top"><div class="sk-logo">seek<span>r</span></div>${form}</div>`;
 if(!hit||hit.none){
  return `<div class="seekr">${top}<div class="nores"><b>NO RESULTS FOUND</b><p>'${esc(q)}'에 대한 결과가 없습니다.${hit?" "+esc(hit.none):" 페이지에서 본 고유명사, 등록번호, 인물 이름처럼 구체적인 단어로 검색해보세요."}</p>${hit&&hit.sugg?`<div class="sk-sugg">${hit.sugg.map(s=>`<button data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>`:""}</div></div>`;
 }
 const res=hit.res();
 return `<div class="seekr">${top}<div class="sk-res"><div class="sk-meta">검색결과 약 ${res.length}건 ${hit.meta?"· "+esc(hit.meta):""}</div>${res.map(x=>`<article class="sk-r"><span class="url">${x.url}</span><h3>${x.title}</h3><p>${x.date?`<span class="date">${x.date} — </span>`:""}${x.text}</p></article>`).join("")}</div></div>`;
}

 S.ended=key;save();

  <div class="hintbox" style="background:#eef6ef;border-color:#6d9c7b"><b>현실에서 써먹기</b> · 친환경 문구를 보면 세 가지를 물어보세요. 누가 검증했나? 범위는 어디까지인가? 숫자의 기준점은 무엇인가?</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="eSite">그린베일 사이트 보기</button><button class="btn" id="eAgain">처음부터 다시</button></div></div>`);
 $("#eSite").onclick=()=>{closeModal();openWin("browser");go("gv/")};
 $("#eAgain").onclick=reset;
}
function reset(){S={found:[],wrong:0,read:["m1"],ended:null};save();closeModal();hist=[];route="gv/";
 Object.keys(WINS).forEach(k=>$("#w-"+k).classList.add("hidden"));renderView();updateMeter();renderEvidence();renderReport();curMail="m1";renderMail();
 openWin("mail");openWin("browser");toast("새 조사를 시작합니다.")}

/* ---------------- boot ---------------- */
function clock(){const d=new Date();$("#clock").textContent=d.toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+" "+d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}
function init(){
 buildIcons();Object.keys(WINS).forEach(makeWin);buildBrowser();renderView();updateMeter();renderEvidence();renderReport();renderMail();renderTasks();clock();setInterval(clock,30000);
 const saved=load();
 if(saved&&saved.found.length){$("#bootResume").hidden=false;$("#bootResume").onclick=()=>{S=saved;$("#boot").hidden=true;renderView();updateMeter();renderEvidence();renderReport();renderMail();openWin("browser")}}
 $("#bootStart").onclick=()=>{$("#boot").hidden=true;S={found:[],wrong:0,read:["m1"],ended:null};save();renderView();updateMeter();renderEvidence();renderReport();renderMail();openWin("browser");openWin("mail")};
 $("#startBtn").onclick=()=>{modal(`<div class="mh"><span>NO GREEN FOUND</span><span>메뉴</span></div><div class="mb"><h3>처음부터 다시 시작할까요?</h3><p style="margin:0;color:var(--muted)">확보한 증거와 진행 상황이 모두 초기화됩니다.</p><div style="display:flex;gap:8px"><button class="btn red" id="rY">초기화</button><button class="btn" id="rN">취소</button></div></div>`);$("#rY").onclick=reset;$("#rN").onclick=closeModal};
 window.addEventListener("resize",()=>document.querySelectorAll(".win:not(.hidden)").forEach(fitWin));
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
}
init();
})();
</script>
</body>
